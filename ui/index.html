<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amiki</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 900px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px 20px;
            border-bottom: 1px solid #252936;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
        }

        .status {
            font-size: 13px;
            color: #7ee787;
        }

        main {
            flex: 1;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .welcome {
            margin: auto;
            text-align: center;
        }

        .welcome h1 {
            margin-bottom: 8px;
        }

        .welcome p {
            color: #9da3b4;
        }

        .composer {
            padding: 16px 20px;
            border-top: 1px solid #252936;
            display: flex;
            gap: 10px;
        }

        .composer input {
            flex: 1;
            padding: 14px;
            border: 1px solid #303442;
            border-radius: 10px;
            background: #181b24;
            color: #fff;
            outline: none;
        }

        .composer button {
            padding: 0 20px;
            border: none;
            border-radius: 10px;
            background: #6c63ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <div class="brand">🌸 Amiki</div>
            <div class="status">● Online</div>
        </header>

        <main>
            <div class="welcome">
                <h1>Hello, Chimz.</h1>
                <p>I'm Amiki. How can I help you today?</p>
            </div>
        </main>

        <div class="composer">
            <input type="text" placeholder="Message Amiki...">
            <button>Send</button>
        </div>
    </div>

    <script>
        const input = document.querySelector(".composer input");
        const button = document.querySelector(".composer button");
        const main = document.querySelector("main");

        function addMessage(sender, text) {
            const message = document.createElement("div");
            message.style.padding = "14px 16px";
            message.style.borderRadius = "10px";
            message.style.background = sender === "You" ? "#1f2430" : "#181b24";
            message.style.alignSelf = sender === "You" ? "flex-end" : "flex-start";
            message.style.maxWidth = "80%";
            message.innerHTML = `<strong>${sender}</strong><br>${text}`;
            main.appendChild(message);
        }

        async function sendMessage() {
            const message = input.value.trim();

            if (!message) {
                return;
            }

            addMessage("You", message);
            input.value = "";
            button.disabled = true;
            button.textContent = "...";

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Request failed.");
                }

                addMessage("Amiki", data.response);

            } catch (error) {
                if (error instanceof TypeError && error.message === "Failed to fetch") {
                    addMessage(
                        "Amiki",
                        "I'm offline right now. Please make sure the Amiki server is running in Termux, then try again."
                    );
                } else {
                    addMessage(
                        "Amiki",
                        "Sorry, something went wrong: " + error.message
                    );
                }
            }

            button.disabled = false;
            button.textContent = "Send";
        }

        button.addEventListener("click", sendMessage);

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>

</body>
</html>
